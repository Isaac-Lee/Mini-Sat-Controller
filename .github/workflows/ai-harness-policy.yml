name: AI Harness Policy

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-pr-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR metadata and review gates
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          python - <<'PY'
          import os
          import re
          import sys

          body = os.environ.get("PR_BODY") or ""
          # Template instructions are not submitted review evidence.
          body = re.sub(r"<!--.*?-->", "", body, flags=re.DOTALL)
          errors = []

          required_headings = [
              "## Linked Issue",
              "## Behavioral change",
              "## Risk class",
              "## Acceptance evidence",
              "## Validation performed",
              "## Runtime / Kubernetes impact",
              "## AI execution",
              "## Independent review gates",
              "## Remaining risk",
          ]
          for heading in required_headings:
              if heading not in body:
                  errors.append(f"Missing required PR section: {heading}")

          if not re.search(r"(?im)^\s*(Closes|Fixes|Resolves|Refs)\s+#\d+\s*$", body):
              errors.append("Link an Issue using 'Closes #123', 'Fixes #123', 'Resolves #123', or 'Refs #123'.")

          risk_matches = re.findall(r"(?im)^-\s*\[[xX]\]\s*(R[0-4])\b", body)
          if len(risk_matches) != 1:
              errors.append("Select exactly one Risk Class checkbox (R0-R4).")
              risk = None
          else:
              risk = risk_matches[0]

          fresh_codex = bool(re.search(r"(?im)^-\s*\[[xX]\]\s*Fresh Codex review completed\s*$", body))
          claude = bool(re.search(r"(?im)^-\s*\[[xX]\]\s*Claude independent review completed\s*$", body))
          human = bool(re.search(r"(?im)^-\s*\[[xX]\]\s*Human review completed\s*$", body))

          if risk in {"R2", "R3", "R4"} and not fresh_codex:
              errors.append(f"{risk} requires a fresh Codex review.")
          if risk in {"R3", "R4"} and not claude:
              errors.append(f"{risk} requires an independent Claude review.")
          if risk in {"R3", "R4"} and not human:
              errors.append(f"{risk} requires recorded human review before merge.")

          # R4 requires explicit acknowledgement that unresolved risk was considered.
          if risk == "R4":
              section = re.search(
                  r"(?is)## Remaining risk\s*(.*?)(?=\n## |\Z)",
                  body,
              )
              remaining = section.group(1).strip() if section else ""
              if len(remaining) < 4:
                  errors.append("R4 requires an explicit Remaining risk statement.")

          if errors:
              print("MSC AI Harness policy check failed:\n")
              for error in errors:
                  print(f"- {error}")
              sys.exit(1)

          print(f"MSC AI Harness policy check passed for {risk}.")
          PY
