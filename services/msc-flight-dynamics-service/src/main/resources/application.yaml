spring:
  application:
    name: flight-dynamics
  config:
    import: classpath:application-platform.yaml
msc:
  events:
    consume: false
  s3:
    enabled: true
    bucket: msc-flight-dynamics
    endpoint: ${MSC_S3_ENDPOINT:}
    access-key: ${MSC_S3_ACCESS_KEY:}
    secret-key: ${MSC_S3_SECRET_KEY:}
  orekit:
    archive: ${MSC_OREKIT_ARCHIVE}
    sha256: ${MSC_OREKIT_SHA256}
